<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIT Awards - Document Submission Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h2 { color: #800000; margin-bottom: 10px; }
        p { color: #555; font-size: 14px; margin-bottom: 25px; }
        .upload-btn {
            display: inline-block;
            background-color: #800000;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .upload-btn:hover {
            background-color: #a00000;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>CIT Awards Portal</h2>
        <p>Please click the button below to submit your requirements and upload your documents for review.</p>
        
        <!-- Tally Form Link Linked Here -->
        <a href="https://tally.so/r/MejOlg" target="_blank" class="upload-btn">Upload Documents Here</a>
    </div>

</body>
</html>
